<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress benign Vite HMR websocket disconnection notices in sandboxed iframe environment
      (function() {
        var origError = console.error;
        console.error = function() {
          var msg = arguments[0] ? String(arguments[0]) : '';
          if (msg.indexOf('[vite] failed to connect to websocket') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('failed to connect to websocket') !== -1) {
            // Demote benign Vite HMR notification to debug level (HMR is disabled by design in container preview)
            if (console.debug) console.debug.apply(console, arguments);
            return;
          }
          origError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && (e.reason || e);
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (e) {
          var msg = (e && e.message) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        });
      })();
    </script>
