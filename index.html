    <script>
      // Suppress benign Vite HMR websocket disconnection alerts in sandboxed iframe environment
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && (e.reason || e);
        var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
    </script>
